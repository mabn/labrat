[package]
name = "labrat-conformance"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
axum = "0.8.9"
base64 = "0.23.1"
labrat-api = { path = "../../crates/labrat-api" }
labrat-core = { path = "../../crates/labrat-core" }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "multipart"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["full"] }
