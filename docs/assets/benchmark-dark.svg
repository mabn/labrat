<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-label="labrat compared with GitLab: 20 merge requests take 0.68 s vs 189 s, idle memory is 15 MB vs 3.0 GB, cold start is 0.01 s vs 4 min.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .mult { font-size: 12.5px; font-weight: 600; fill: #aa92dd; }
    .label-accent { font-size: 13px; font-weight: 600; fill: #aa92dd; }
    .label-muted { font-size: 13px; font-weight: 400; fill: #8b949e; }
    .val-accent { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .val-muted { font-size: 13px; font-weight: 400; fill: #8b949e; }
    .bar-accent { fill: #aa92dd; }
    .bar-muted { fill: #484f58; }
    .axis { stroke: #30363d; stroke-width: 1; }
  </style>

  
  <text x="86" y="24" class="title">Run 20 merge requests from creation to merge</text>
  <text x="666" y="24" text-anchor="end" class="mult">278× faster</text>
  <line x1="85.5" y1="34" x2="85.5" y2="86" class="axis" />

  <text x="72" y="50" text-anchor="end" class="label-accent">labrat</text>
  <rect x="86" y="36" width="3" height="20" rx="1.5" class="bar-accent" />
  <text x="97" y="50" class="val-accent">0.68 s</text>

  <text x="72" y="78" text-anchor="end" class="label-muted">GitLab</text>
  <rect x="86" y="64" width="580" height="20" rx="3" class="bar-muted" />
  <text x="676" y="78" class="val-muted">189 s</text>

  
  <text x="86" y="128" class="title">Memory when idle</text>
  <text x="666" y="128" text-anchor="end" class="mult">200× less memory</text>
  <line x1="85.5" y1="138" x2="85.5" y2="190" class="axis" />

  <text x="72" y="154" text-anchor="end" class="label-accent">labrat</text>
  <rect x="86" y="140" width="3.5" height="20" rx="1.5" class="bar-accent" />
  <text x="98" y="154" class="val-accent">15 MB</text>

  <text x="72" y="182" text-anchor="end" class="label-muted">GitLab</text>
  <rect x="86" y="168" width="580" height="20" rx="3" class="bar-muted" />
  <text x="676" y="182" class="val-muted">3.0 GB</text>

  
  <text x="86" y="232" class="title">Start from an empty data directory</text>
  <text x="666" y="232" text-anchor="end" class="mult">so fast!</text>
  <line x1="85.5" y1="242" x2="85.5" y2="294" class="axis" />

  <text x="72" y="258" text-anchor="end" class="label-accent">labrat</text>
  <rect x="86" y="244" width="2" height="20" rx="1" class="bar-accent" />
  <text x="96" y="258" class="val-accent">0.01 s</text>

  <text x="72" y="286" text-anchor="end" class="label-muted">GitLab</text>
  <rect x="86" y="272" width="580" height="20" rx="3" class="bar-muted" />
  <text x="676" y="286" class="val-muted">4 min</text>
</svg>