[workspace]
resolver = "3"
members = ["crates/*", "tests/conformance", "tests/client"]

[workspace.package]
edition = "2024"
version = "0.2.0"
publish = false

# Keep build output small: full debug info for every test binary used ~10 GB.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# The profile release binaries are built with (`dist build`); see dist-workspace.toml.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
