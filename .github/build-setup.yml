- name: Install Node.js
  uses: actions/setup-node@v7
  with:
    node-version: 22
# pnpm comes from corepack, at the version in web/package.json's packageManager field.
- name: Install pnpm
  shell: bash
  run: |
    corepack enable
    echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> "$GITHUB_ENV"
- name: Require the embedded web UI
  shell: bash
  run: echo "LABRAT_REQUIRE_WEB_UI=1" >> "$GITHUB_ENV"
