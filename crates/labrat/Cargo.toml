[package]
name = "labrat"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "A fast, lightweight GitLab simulator for testing anything that talks to GitLab"
repository = "https://github.com/mabn/labrat"
homepage = "https://github.com/mabn/labrat"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
labrat-api = { path = "../labrat-api" }
labrat-core = { path = "../labrat-core" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

# publish = false keeps labrat off crates.io; dist would skip it too unless told otherwise.
[package.metadata.dist]
dist = true
