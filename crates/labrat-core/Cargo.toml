[package]
name = "labrat-core"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
labrat-git = { version = "0.1.0", path = "../labrat-git" }
hex = "0.4.3"
parking_lot = "0.13.0"
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
tracing = "0.1.44"
dissimilar = "1.0.11"
